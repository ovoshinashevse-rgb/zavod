<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ЗАВОД</title>
<script src="/socket.io/socket.io.js"></script>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/themes.css">
<link rel="stylesheet" href="/css/badge.css">
</head>
<body>

  <!-- ЭКРАН 1: ВХОД -->
  <div class="glass" id="wrap-enter">
    <div id="screen-enter">
      <h1>ЗАВОД</h1>
      <div class="subtitle">
        Вы перед входом на завод.<br>
        Прежде чем начать смену —<br>
        пройдите в курилку.
      </div>
      <input class="input" id="input-name" placeholder="Как вас зовут?" maxlength="20">
      <button class="btn" id="btn-to-smoking">Пройти в курилку</button>
    </div>
  </div>

  <!-- ЭКРАН 2: КУРИЛКА -->
  <div class="glass hidden" id="wrap-smoking">
    <div id="screen-smoking">
      <h1>КУРИЛКА</h1>
      <div class="subtitle">Здесь ждут остальные.</div>
      <div class="players" id="smoking-players"></div>

      <div class="row" style="margin-top:20px;">
        <button class="btn" id="btn-smoke">Сделать затяжку</button>
        <button class="btn secondary" id="btn-wave">Отмахнуть дым</button>
      </div>

      <button class="btn warn hidden" id="btn-hurry">Поторопить</button>
      <button class="btn secondary" id="btn-invite">Позвать коллегу</button>
    </div>
  </div>

  <!-- ЭКРАН 3: ПРОПУСК (без .glass — бейдж сам по себе) -->
  <div class="hidden" id="screen-role">
    <div class="badge">
      <div class="badge-card">
        <div class="badge-name" id="badge-name">—</div>
        <div class="badge-role" id="badge-role">—</div>
        <div class="badge-role-label">должность</div>
        <div class="badge-footer">
          <div class="col">
            Отдел<br><strong id="badge-dept">—</strong>
          </div>
          <div class="col right">
            Пропуск №<br><strong id="badge-id">—</strong>
          </div>
        </div>
      </div>
    </div>
    <button class="btn" id="btn-start-shift" style="max-width:340px;margin:28px auto 0;">Приступить</button>
  </div>

  <!-- ЭКРАН 4: СМЕНА -->
  <div class="glass hidden" id="wrap-game">
    <div id="screen-game">
      <h1>СМЕНА</h1>
      <div class="subtitle">Первая смена началась.</div>
      <div class="subtitle" style="font-size:18px;opacity:0.5;">
        (здесь появятся кнопки в Шаге B)
      </div>
    </div>
  </div>

  <!-- ЭКРАН 5: ПАУЗА -->
  <div class="glass hidden" id="wrap-pause">
    <div id="screen-pause">
      <h1>ПАУЗА</h1>
      <div class="subtitle">
        Смена приостановлена.<br>
        Кто-то отошёл.
      </div>
      <div class="players" id="pause-players"></div>
      <button class="btn secondary" id="btn-invite-2">Позвать</button>
    </div>
  </div>

<script>
  const socket = io();
  let myName = '';
  let myRole = null;
  let myStatus = 'thinking';
  let currentLevel = 0;

  const DEPARTMENTS = {
    director:   'Дирекция',
    security:   'Служба безопасности',
    accountant: 'Бухгалтерия',
    engineer:   'Производство',
    hr:         'Отдел кадров',
    marketer:   'Маркетинг'
  };

  const screens = {
    'screen-enter': 'wrap-enter',
    'screen-smoking': 'wrap-smoking',
    'screen-role': 'screen-role',
    'screen-game': 'wrap-game',
    'screen-pause': 'wrap-pause'
  };

  function show(id) {
    Object.values(screens).forEach(x => {
      const el = document.getElementById(x);
      if (el) el.classList.add('hidden');
    });
    const target = document.getElementById(screens[id]);
    if (target) target.classList.remove('hidden');

    if (id === 'screen-smoking') {
      document.body.classList.add('in-smoking');
      applyDensity(currentLevel);
    } else {
      document.body.classList.remove('in-smoking', 'density-off', 'density-light', 'density-medium', 'density-heavy');
    }
  }

  function applyDensity(level) {
    document.body.classList.remove('density-off', 'density-light', 'density-medium', 'density-heavy');

    let cls;
    if (level <= 0) cls = 'density-off';
    else if (level <= 3) cls = 'density-light';
    else if (level <= 7) cls = 'density-medium';
    else cls = 'density-heavy';

    document.body.classList.add(cls);
    document.getElementById('btn-wave').disabled = level <= 0;
  }

  document.getElementById('btn-to-smoking').onclick = () => {
    const name = document.getElementById('input-name').value.trim();
    if (!name) { alert('Введите имя'); return; }
    myName = name;
    socket.emit('enter_smoking', { name });
    show('screen-smoking');
  };

  document.getElementById('btn-smoke').onclick = () => {
    socket.emit('smoke_action', { type: 'smoke' });
  };
  document.getElementById('btn-wave').onclick = () => {
    socket.emit('smoke_action', { type: 'wave' });
  };

  function updateStatusButtons() {
    document.getElementById('btn-smoke').classList.toggle('success', myStatus === 'smoke');
    document.getElementById('btn-wave').classList.toggle('success', myStatus === 'wave');
  }

  document.getElementById('btn-hurry').onclick = () => {
    socket.emit('hurry');
  };

  function invite() {
    const url = window.location.href;
    if (navigator.share) {
      navigator.share({ title: 'ЗАВОД', text: 'Зайди на завод, я уже в курилке', url });
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(() => alert('Ссылка скопирована'));
    } else {
      alert('Ссылка: ' + url);
    }
  }
  document.getElementById('btn-invite').onclick = invite;
  document.getElementById('btn-invite-2').onclick = invite;

  socket.on('smoking_update', ({ players, smokeLevel }) => {
    currentLevel = smokeLevel;
    if (document.body.classList.contains('in-smoking')) {
      applyDensity(smokeLevel);
    }

    const box = document.getElementById('smoking-players');
    box.innerHTML = '';

    players.forEach(p => {
      const row = document.createElement('div');
      let cls = 'player';
      if (p.status === 'smoke') cls += ' smoke';
      if (p.status === 'wave')  cls += ' wave';
      row.className = cls;

      const icon = p.status === 'smoke' ? '🚬' :
                   p.status === 'wave'  ? '💨' : '⏳';

      row.innerHTML = '<span>' + p.name + (p.id === socket.id ? ' (вы)' : '') + '</span>' +
                      '<span class="status">' + icon + '</span>';
      box.appendChild(row);
    });

    const me = players.find(p => p.id === socket.id);
    if (me) myStatus = me.status;
    updateStatusButtons();

    const someoneThinking = players.some(p => p.status === 'thinking' && p.id !== socket.id);
    const iDecided = me && me.status !== 'thinking';
    const btnHurry = document.getElementById('btn-hurry');
    if (someoneThinking && iDecided) btnHurry.classList.remove('hidden');
    else btnHurry.classList.add('hidden');
  });

  socket.on('hurried', () => {
    const box = document.getElementById('smoking-players');
    Array.from(box.children).forEach(el => {
      el.classList.add('hurried');
      setTimeout(() => el.classList.remove('hurried'), 1500);
    });
  });

  socket.on('your_role', ({ role, label }) => {
    myRole = role;

    document.getElementById('badge-name').textContent = myName;
    document.getElementById('badge-role').textContent = label;
    document.getElementById('badge-dept').textContent = DEPARTMENTS[role] || '—';
    document.getElementById('badge-id').textContent =
      String(Math.floor(1000 + Math.random() * 9000)) + '-' + String(Math.floor(10 + Math.random() * 90));

    show('screen-role');
  });

  document.getElementById('btn-start-shift').onclick = () => {
    show('screen-game');
  };

  socket.on('paused', ({ disconnected }) => {
    const box = document.getElementById('pause-players');
    box.innerHTML = '';
    disconnected.forEach(name => {
      const row = document.createElement('div');
      row.className = 'player';
      row.textContent = name + ' отошёл';
      box.appendChild(row);
    });
    show('screen-pause');
  });

  socket.on('resumed', () => {
    show('screen-game');
  });

  // ── Запрет зума жестами ──
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('gestureend', e => e.preventDefault());

  document.addEventListener('touchmove', e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  let lastTouch = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouch <= 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });
</script>
</body>
</html>
